<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes finances</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ef;--surf:#fff;--ink:#14232b;--mut:#5c6b72;--line:#d5dcd9;--acc:#0f6e7a;--acc2:#c98a1b;--neg:#b3412f;--pos:#2d7a4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--surf:#18242a;--ink:#e6eeee;--mut:#93a4a9;--line:#2a3a41;--acc:#4fb3bf;--acc2:#e0a63c;--neg:#e0715d;--pos:#63b985}}
:root[data-theme="dark"]{--bg:#10181c;--surf:#18242a;--ink:#e6eeee;--mut:#93a4a9;--line:#2a3a41;--acc:#4fb3bf;--acc2:#e0a63c;--neg:#e0715d;--pos:#63b985}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 12px}
p.sub{margin:0 0 18px;color:var(--mut)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
nav a{padding:10px 16px;color:var(--mut);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--ink);border-color:var(--acc)}
nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
button,.btn{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--mut);padding:2px 8px;border:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mut)}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:5px 0;cursor:pointer;font-size:14px;border:0;background:none;width:100%;color:var(--ink);text-align:left;font-weight:400}
.bar.sel{font-weight:700}
.track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--acc);border-radius:6px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.l{white-space:normal;min-width:180px}
th.r,td.r{text-align:right}
th{color:var(--mut);font-weight:500;font-size:13px}
.empty{color:var(--mut);padding:8px 0}
.prog{height:16px;background:var(--bg);border-radius:8px;overflow:hidden;margin:8px 0}
.prog div{height:100%;background:var(--acc2)}
.note{font-size:13px;color:var(--mut);margin-top:8px}
@media (max-width:560px){.bar{grid-template-columns:100px 1fr 70px}}
</style>
</head>
<body>
<main>
<h1>Mes finances</h1>
<p class="sub">Tout reste dans ton navigateur. Rien n’est envoyé nulle part.</p>
<nav id="nav"><a href="#budget">Budget</a><a href="#pea">PEA</a><a href="#credit">Crédit immobilier</a></nav>
<div id="app"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const E=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const E2=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='finances-v1';
let S={tx:[],pea:{pos:[],verse:'',open:''},cred:{capital:'',taux:'',annees:'',debut:'',assur:''},month:'all',cat:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const CATS=['Alimentation','Restaurants','Transport','Logement & crédit','Abonnements','Loisirs','Santé','Shopping','Épargne','Revenus','Autre'];
const RULES=[
['Épargne',/trade ?republic|\bpea\b|livret|epargne|épargne|assurance.?vie/i],
['Logement & crédit',/pret|prêt|echeance|échéance|credit imm|crédit imm|loyer|edf|engie|veolia|syndic|taxe fonc|assurance hab|\beau\b/i],
['Alimentation',/carrefour|leclerc|lidl|auchan|intermarch|monoprix|aldi|super ?u|casino|picard|biocoop|grand frais|franprix|boulanger|drive|primeur|boucherie/i],
['Restaurants',/restaurant|mcdo|mcdonald|burger|uber ?eats|deliveroo|pizza|kebab|caf[eé]|brasserie|sushi|bar /i],
['Transport',/sncf|total|esso|\bbp\b|station|essence|p[eé]age|vinci|uber|ratp|navigo|parking|autoroute|carburant|blablacar/i],
['Abonnements',/netflix|spotify|disney|canal|prime video|apple\.com|google|orange|sfr|bouygues|free mobile|\bfree\b|deezer|abonnement/i],
['Santé',/pharmacie|docteur|dr |m[eé]decin|dentiste|mutuelle|optique|kin[eé]/i],
['Loisirs',/cin[eé]ma|fnac|decathlon|d[eé]cathlon|steam|playstation|cultura|sport|p[eê]che|concert|ticketmaster|voyage|booking|airbnb|jeux|bowling/i],
['Shopping',/amazon|zalando|ikea|leroy ?merlin|castorama|action|vinted|cdiscount|h&m|kiabi/i]];
const guess=(label,amt)=>{if(amt>0&&!/trade ?republic|\bpea\b/i.test(label))return'Revenus';for(const[c,re]of RULES)if(re.test(label))return c;return'Autre'};

function parseCSV(t){const d=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';
 const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
  else c+=ch}
 r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
const num=s=>{if(s==null)return NaN;s=String(s).replace(/[\s\u00a0€+]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');return s===''?NaN:parseFloat(s)};
const pdate=s=>{s=String(s).trim();let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;
 m=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length==2?'20'+m[3]:m[3];return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null};

function importRows(rows){
 let h=rows.findIndex((r,i)=>i<20&&r.some(x=>/^date/i.test(x.trim()))&&r.some(x=>/montant|amount|d[eé]bit|cr[eé]dit/i.test(x)));
 let hdr=h>=0?rows[h].map(x=>x.trim()):null,body=h>=0?rows.slice(h+1):rows;
 const idx=re=>hdr?hdr.findIndex(x=>re.test(x)):-1;
 let iD=idx(/^date/i),iL=idx(/libell|label|description|intitul|d[eé]tail|objet/i),iM=idx(/^montant|amount/i),iDb=idx(/d[eé]bit/i),iCr=idx(/cr[eé]dit/i);
 if(!hdr){iD=0;iL=1;iM=2}
 if(iD<0)iD=0;if(iL<0)iL=1;
 const seen={};let added=0;
 const have={};S.tx.forEach(t=>{const k=t.date+'|'+t.label+'|'+t.amount;have[k]=(have[k]||0)+1});
 for(const r of body){const date=pdate(r[iD]||'');if(!date)continue;
  let a=iM>=0?num(r[iM]):NaN;
  if(isNaN(a)&&(iDb>=0||iCr>=0)){const db=num(r[iDb]),cr=num(r[iCr]);a=(isNaN(cr)?0:Math.abs(cr))-(isNaN(db)?0:Math.abs(db))}
  if(isNaN(a)||a===0)continue;
  const label=(r[iL]||'').trim().replace(/\s+/g,' ');const k=date+'|'+label+'|'+a;
  seen[k]=(seen[k]||0)+1;if(seen[k]<=(have[k]||0))continue;
  S.tx.push({date,label,amount:a,cat:guess(label,a)});added++}
 S.tx.sort((a,b)=>b.date.localeCompare(a.date));save();return added}

function readFile(f){const rd=new FileReader();rd.onload=()=>{const b=rd.result;let t;
 try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('windows-1252').decode(b)}
 const n=importRows(parseCSV(t.replace(/^\uFEFF/,'')));msg(n?`${n} opérations importées.`:'Aucune opération reconnue. Vérifie que le fichier est un export CSV avec une colonne date et un montant.');render()};rd.readAsArrayBuffer(f)}
let flash='';const msg=t=>{flash=t};

function sample(){const m=['2026-08','2026-09','2026-10'];const L=[['Carrefour',-86.4,3],['Leclerc drive',-112.7,2],['Restaurant Le Quai',-48,2],['Total station',-62,2],['Netflix',-13.49,1],['Pharmacie',-18.3,1],['Decathlon',-74.9,1],['Prêt immobilier échéance',-912,1],['Salaire',2650,1],['Virement Trade Republic',-300,1],['Amazon',-39.9,1]];
 S.tx=[];m.forEach(mo=>L.forEach(([l,a,n])=>{for(let i=0;i<n;i++){const d=String(2+i*9+Math.floor(Math.random()*5)).padStart(2,'0');S.tx.push({date:`${mo}-${d}`,label:l,amount:+(a*(a<0&&n>1?(0.85+Math.random()*.3):1)).toFixed(2),cat:guess(l,a)})}}));
 S.tx.sort((a,b)=>b.date.localeCompare(a.date));save();msg('Données d’exemple chargées. Efface-les avant d’importer tes vrais relevés.');render()}

const MN=m=>{const[y,mm]=m.split('-');return new Date(y,mm-1,1).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})};

function budget(){
 const months=[...new Set(S.tx.map(t=>t.date.slice(0,7)))].sort().reverse();
 if(S.month!=='all'&&!months.includes(S.month))S.month='all';
 const inM=S.tx.filter(t=>S.month==='all'||t.date.startsWith(S.month));
 const rev=inM.filter(t=>t.cat==='Revenus'||t.amount>0).reduce((s,t)=>s+(t.amount>0?t.amount:0),0);
 const out=inM.filter(t=>t.amount<0);
 const ep=out.filter(t=>t.cat==='Épargne').reduce((s,t)=>s-t.amount,0);
 const dep=out.filter(t=>t.cat!=='Épargne').reduce((s,t)=>s-t.amount,0);
 const bycat={};out.forEach(t=>bycat[t.cat]=(bycat[t.cat]||0)-t.amount);
 const cats=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);const mx=cats.length?cats[0][1]:1;
 const shown=inM.filter(t=>!S.cat||t.cat===S.cat);
 let h=`<div class="panel"><div class="row"><label class="btn" style="cursor:pointer">Importer un relevé (CSV)<input id="file" type="file" accept=".csv,.txt" hidden></label>
 <button class="alt" id="demo">Voir un exemple</button>${S.tx.length?'<button class="alt" id="clear">Tout effacer</button>':''}</div>
 ${flash?`<div class="note" role="status">${esc(flash)}</div>`:''}
 <div class="note">Dans l’espace client de ta banque, cherche « Exporter » ou « Télécharger » sur la liste des opérations, au format CSV ou Excel (enregistre l’Excel en CSV). Tu peux importer plusieurs mois, les doublons sont ignorés.</div></div>`;
 if(!S.tx.length)return h+'<div class="drop">Dépose un fichier ci-dessus pour voir ton budget apparaître.</div>';
 const sav=rev?Math.round((rev-dep)/rev*100):0;
 h+=`<div class="row"><label>Période<select id="mon"><option value="all">Tout</option>${months.map(m=>`<option value="${m}" ${S.month===m?'selected':''}>${MN(m)}</option>`).join('')}</select></label></div>
 <div class="kpis"><div class="kpi"><span>Revenus</span><b class="pos">${E(rev)}</b></div><div class="kpi"><span>Dépenses</span><b>${E(dep)}</b></div><div class="kpi"><span>Épargne versée</span><b>${E(ep)}</b></div><div class="kpi"><span>Solde de la période</span><b class="${rev-dep-ep>=0?'pos':'neg'}">${E(rev-dep-ep)}</b></div><div class="kpi"><span>Part de revenus non dépensée</span><b>${sav} %</b></div></div>`;
 h+=`<div class="panel"><h2>Où part l’argent</h2>${cats.map(([c,v])=>`<button class="bar ${S.cat===c?'sel':''}" data-cat="${esc(c)}"><span>${esc(c)}</span><span class="track"><span class="fill" style="display:block;width:${v/mx*100}%"></span></span><span>${E(v)}</span></button>`).join('')||'<div class="empty">Aucune dépense sur cette période.</div>'}<div class="note">Clique sur une catégorie pour filtrer les opérations.</div></div>`;
 const ms=[...months].reverse();
 if(ms.length>1){const agg=ms.map(m=>{const t=S.tx.filter(x=>x.date.startsWith(m));return[m,t.filter(x=>x.amount>0).reduce((s,x)=>s+x.amount,0),-t.filter(x=>x.amount<0&&x.cat!=='Épargne').reduce((s,x)=>s+x.amount,0)]});
  const M=Math.max(...agg.flat().filter(x=>typeof x==='number'),1),w=600/agg.length;
  h+=`<div class="panel"><h2>Mois par mois</h2><div class="tw"><svg viewBox="0 0 600 180" style="width:100%;min-width:320px" role="img" aria-label="Revenus et dépenses par mois">${agg.map(([m,r,d],i)=>{const x=i*w+w*.12,bw=w*.34;return`<rect x="${x}" y="${150-r/M*130}" width="${bw}" height="${r/M*130}" fill="var(--acc2)"/><rect x="${x+bw+2}" y="${150-d/M*130}" width="${bw}" height="${d/M*130}" fill="var(--acc)"/><text x="${x+bw}" y="170" font-size="11" text-anchor="middle" fill="var(--mut)">${MN(m)}</text>`}).join('')}</svg></div><div class="note"><span style="color:var(--acc2)">■</span> Revenus &nbsp; <span style="color:var(--acc)">■</span> Dépenses</div></div>`}
 h+=`<div class="panel"><h2>Opérations${S.cat?' : '+esc(S.cat):''} (${shown.length})</h2><div class="tw"><table><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th class="r">Montant</th></tr></thead><tbody>${shown.slice(0,300).map(t=>`<tr><td>${t.date.split('-').reverse().join('/')}</td><td class="l">${esc(t.label)}</td><td><select data-i="${S.tx.indexOf(t)}">${CATS.map(c=>`<option ${c===t.cat?'selected':''}>${c}</option>`).join('')}</select></td><td class="r ${t.amount>0?'pos':''}">${E2(t.amount)}</td></tr>`).join('')}</tbody></table></div>${shown.length>300?'<div class="note">300 premières opérations affichées.</div>':''}</div>`;
 return h}

function pea(){const P=S.pea;
 const val=P.pos.reduce((s,p)=>s+p.qty*p.price,0),cost=P.pos.reduce((s,p)=>s+p.qty*p.pru,0);
 const pv=val-cost,perf=cost?pv/cost*100:0,v=num(P.verse);
 const fin=P.open?new Date(new Date(P.open).setFullYear(new Date(P.open).getFullYear()+5)):null;
 let h=`<div class="kpis"><div class="kpi"><span>Valeur actuelle</span><b>${E(val)}</b></div><div class="kpi"><span>Montant investi</span><b>${E(cost)}</b></div><div class="kpi"><span>Plus-value latente</span><b class="${pv>=0?'pos':'neg'}">${E(pv)}</b></div><div class="kpi"><span>Performance</span><b class="${perf>=0?'pos':'neg'}">${perf.toFixed(1)} %</b></div></div>
 <div class="panel"><h2>Mon enveloppe</h2><div class="grid"><label>Total versé sur le PEA (€)<input id="verse" inputmode="decimal" value="${esc(P.verse)}"></label><label>Date d’ouverture<input id="open" type="date" value="${esc(P.open)}"></label></div>
 <div class="note">${!isNaN(v)&&v>0?`Plafond de versements : 150 000 €. Il te reste ${E(150000-v)} de capacité. `:''}${fin?`Les 5 ans sont atteints le ${fin.toLocaleDateString('fr-FR')}${fin>new Date()?'':' (déjà passé : retraits possibles sans clôturer)'}.`:''}</div></div>
 <div class="panel"><h2>Mes lignes</h2>`;
 if(P.pos.length){const mx=Math.max(...P.pos.map(p=>p.qty*p.price),1);
  h+=`<div class="tw"><table><thead><tr><th>Ligne</th><th class="r">Quantité</th><th class="r">PRU</th><th class="r">Cours</th><th class="r">Valeur</th><th class="r">+/- value</th><th class="r">Poids</th><th></th></tr></thead><tbody>${P.pos.map((p,i)=>{const vv=p.qty*p.price,g=vv-p.qty*p.pru;return`<tr><td>${esc(p.name)}</td><td class="r">${p.qty}</td><td class="r">${E2(p.pru)}</td><td class="r"><input class="px" data-i="${i}" value="${p.price}" style="width:90px;text-align:right" inputmode="decimal" aria-label="Cours de ${esc(p.name)}"></td><td class="r">${E(vv)}</td><td class="r ${g>=0?'pos':'neg'}">${E(g)} (${p.pru?(g/(p.qty*p.pru)*100).toFixed(1):0} %)</td><td class="r">${val?(vv/val*100).toFixed(0):0} %</td><td><button class="x" data-del="${i}" aria-label="Supprimer">✕</button></td></tr>`}).join('')}</tbody></table></div><div class="note">Mets à jour le cours de chaque ligne en le modifiant directement dans le tableau.</div>`}
 else h+='<div class="empty">Aucune ligne pour l’instant. Ajoute ton premier ETF ou ta première action ci-dessous.</div>';
 h+=`<h2 style="margin-top:20px">Ajouter une ligne</h2><div class="grid"><label>Nom<input id="pn" placeholder="ex. ETF MSCI World PEA"></label><label>Quantité<input id="pq" inputmode="decimal"></label><label>Prix de revient unitaire (€)<input id="pp" inputmode="decimal"></label><label>Cours actuel (€)<input id="pc" inputmode="decimal"></label></div><div class="row" style="margin-top:12px"><button id="padd">Ajouter la ligne</button></div></div>`;return h}

function credit(){const C=S.cred,K=num(C.capital),t=num(C.taux),n=num(C.annees)*12,a=num(C.assur)||0;
 let h=`<div class="panel"><h2>Mon prêt</h2><div class="grid"><label>Capital emprunté (€)<input data-c="capital" inputmode="decimal" value="${esc(C.capital)}"></label><label>Taux annuel hors assurance (%)<input data-c="taux" inputmode="decimal" value="${esc(C.taux)}"></label><label>Durée (années)<input data-c="annees" inputmode="decimal" value="${esc(C.annees)}"></label><label>Date de la 1re échéance<input data-c="debut" type="date" value="${esc(C.debut)}"></label><label>Assurance par mois (€)<input data-c="assur" inputmode="decimal" value="${esc(C.assur)}"></label></div></div>`;
 if(!(K>0&&n>0&&t>=0&&C.debut))return h+'<div class="empty">Renseigne le capital, le taux, la durée et la date de la première échéance pour voir le détail. Tout se trouve sur ton tableau d’amortissement.</div>';
 const r=t/1200,M=r?K*r/(1-Math.pow(1+r,-n)):K/n;
 const st=new Date(C.debut),now=new Date();let k=(now.getFullYear()-st.getFullYear())*12+now.getMonth()-st.getMonth()+(now.getDate()>=st.getDate()?1:0);k=Math.max(0,Math.min(n,k));
 const bal=j=>r?K*Math.pow(1+r,j)-M*(Math.pow(1+r,j)-1)/r:K-M*j;
 const crd=Math.max(0,bal(k)),left=n-k,end=new Date(st);end.setMonth(end.getMonth()+n-1);
 const totInt=M*n-K,paidInt=M*k-(K-crd),pct=k/n*100;
 const ly=Math.floor(left/12),lm=Math.round(left%12);
 h+=`<div class="kpis"><div class="kpi"><span>Mensualité</span><b>${E2(M+a)}</b><span>dont assurance ${E2(a)}</span></div><div class="kpi"><span>Capital restant dû</span><b>${E(crd)}</b></div><div class="kpi"><span>Temps restant</span><b>${left>0?`${ly} an${ly>1?'s':''} ${lm} mois`:'Soldé'}</b><span>fin le ${end.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</span></div><div class="kpi"><span>Coût total des intérêts</span><b>${E(totInt)}</b></div></div>
 <div class="panel"><h2>Avancement</h2><div class="prog" role="img" aria-label="${pct.toFixed(0)} % remboursé"><div style="width:${pct}%"></div></div>

<script>
S.owners=S.owners||['Couple','Enfant 1'];S.acc=S.acc||[];S.ptf=S.ptf||{pea:[],cto:[]};S.pv=S.pv||{};S.loans=S.loans||[];S.fo=S.fo||'Tous';

const sum=(a,k)=>a.reduce((s,x)=>s+(k?x[k]:x),0),sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;

function sched(K,t,y,s,a){const r=t/1200,n=Math.round(y*12),M=r?K*r/(1-Math.pow(1+r,-n)):K/n,o=[];let b=K;for(let i=0;i<n;i++){const d=new Date(s);d.setMonth(d.getMonth()+i);const it=b*r,c=M-it;b-=c;o.push({d:iso(d),tot:M+a,cap:c,int:it,ass:a,crd:Math.max(b,0)})}return o}

function parseAm(R){const h=R.findIndex((r,i)=>i<20&&r.some(x=>/date|[eé]ch[eé]ance/i.test(x))&&r.some(x=>/int[eé]r|restant|capital/i.test(x)));const H=h>=0?R[h]:null,B=h>=0?R.slice(h+1):R,ix=re=>H?H.findIndex(x=>re.test(x)):-1;
 let c=H?{d:ix(/date/i),tot:ix(/mensualit|montant|total|^[eé]ch[eé]ance$/i),crd:ix(/restant|crd|solde/i),cap:ix(/amort|principal|capital(?!.*restant)/i),int:ix(/int[eé]r/i),ass:ix(/assur/i)}:{d:0,tot:1,cap:2,int:3,ass:4,crd:5};if(c.d<0)c.d=0;
 const o=[],z=x=>isNaN(x)?0:Math.abs(x);for(const r of B){const d=pdate(r[c.d]||'');if(!d)continue;const g=k=>c[k]>=0?num(r[c[k]]):NaN;const cap=z(g('cap')),int=z(g('int')),ass=z(g('ass'));let tot=z(g('tot'));if(!tot)tot=cap+int+ass;o.push({d,tot,cap,int,ass,crd:z(g('crd'))})}

const kp=(a)=>`<div class="kpis">${a.map(([l,v,c])=>`<div class="kpi"><span>${l}</span><b class="${c||''}">${v}</b></div>`).join('')}</div>`;
const pvl=k=>sum(S.ptf[k].map(p=>p.qty*p.price));

 if(Ls.length)h+=kp([['Mensualité totale',E2(sum(Ls.map(x=>x[1]),'m'))],['Capital restant dû',E(sum(Ls.map(x=>x[1]),'crd'))],['Intérêts restant à payer',E(sum(Ls.map(x=>x[1]),'il'))],['Nombre de prêts',Ls.length]]);

function pat(){const A=S.acc,bank=sum(A,'bal'),debt=sum(S.loans.map(st),'crd');let h=kp([['Comptes et livrets',E(bank)],['PEA',E(pvl('pea'))],['CTO',E(pvl('cto'))],['Crédits restant dus',E(debt),'neg'],['Patrimoine net',E(bank+pvl('pea')+pvl('cto')-debt),'pos']]);
 h+=S.owners.map(o=>{const L=A.map((a,i)=>[a,i]).filter(([a])=>a.own===o);return`<div class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(o)}</h2><b>${E(sum(L.map(x=>x[0]),'bal'))}</b></div>${L.length?`<div class="tw"><table><tbody>${L.map(([a,i])=>`<tr><td>${esc(a.type)}</td><td>${esc(a.name||'')}</td><td class="r"><input data-ab="${i}" value="${a.bal}" inputmode="decimal" style="width:110px;text-align:right" aria-label="Solde"></td><td><button class="x" data-da="${i}" aria-label="Supprimer">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun compte. Ajoute-en un ci-dessous.</div>'}</div>`}).join('');
 h+=`<div class="panel"><h2>Ajouter un compte ou un livret</h2><div class="grid"><label>Titulaire${sel('ao',S.owners,S.owners[0])}</label><label>Type${sel('at',TY,TY[0])}</label><label>Nom (facultatif)<input id="an" placeholder="ex. Crédit Agricole"></label><label>Solde (€)<input id="ab" inputmode="decimal"></label></div><div class="row" style="margin-top:12px"><button id="aadd">Ajouter</button></div><h2 style="margin-top:20px">Ajouter un enfant</h2><div class="row"><input id="on" placeholder="Prénom"><button class="alt" id="oadd">Ajouter</button></div></div>`;return h}
function ptf(k){const f=S.fo,all=S.ptf[k].map((p,i)=>[p,i]),R=all.filter(([p])=>f==='Tous'||p.own===f),val=sum(R.map(([p])=>p.qty*p.price)),cost=sum(R.map(([p])=>p.qty*p.pru)),g=val-cost,K=k.toUpperCase();
 let h=`<div class="row"><label>Titulaire${sel('fo',['Tous',...S.owners],f)}</label></div>`+kp([['Valeur actuelle',E(val)],['Montant investi',E(cost)],['Plus-value latente',E(g),g>=0?'pos':'neg'],['Performance',(cost?g/cost*100:0).toFixed(1)+' %',g>=0?'pos':'neg']]);
 if(k==='pea')h+=`<div class="panel"><h2>Versements et ouverture</h2>${S.owners.filter(o=>f==='Tous'||o===f).map(o=>{const v=S.pv[o]||{},n=num(v.verse),fin=v.open?new Date(new Date(v.open).setFullYear(new Date(v.open).getFullYear()+5)):null;return`<div class="grid" style="margin-bottom:8px"><label>${esc(o)} : total versé (€)<input data-pv="${esc(o)}" data-k="verse" value="${esc(v.verse||'')}" inputmode="decimal"></label><label>Date d’ouverture<input type="date" data-pv="${esc(o)}" data-k="open" value="${esc(v.open||'')}"></label></div><div class="note">${n>0?`Capacité restante sous le plafond de 150 000 € : ${E(150000-n)}. `:''}${fin?`5 ans atteints le ${fin.toLocaleDateString('fr-FR')}.`:''}</div>`}).join('')}</div>`;
 if(R.length)h+=`<div class="panel"><h2>Investi et valeur actuelle</h2>${hb(R.map(([p])=>[p.name,p.qty*p.pru,p.qty*p.price]))}</div>`;h+=`<div class="panel"><h2>Mes lignes ${K}</h2>${R.length?`<div class="tw"><table><thead><tr><th>Titulaire</th><th>Ligne</th><th class="r">Qté</th><th class="r">PRU</th><th class="r">Cours</th><th class="r">Valeur</th><th class="r">+/- value</th><th></th></tr></thead><tbody>${R.map(([p,i])=>{const v=p.qty*p.price,d=v-p.qty*p.pru;return`<tr><td>${esc(p.own)}</td><td>${esc(p.name)}</td><td class="r">${p.qty}</td><td class="r">${E2(p.pru)}</td><td class="r"><input class="px2" data-i="${i}" value="${p.price}" inputmode="decimal" style="width:90px;text-align:right" aria-label="Cours de ${esc(p.name)}"></td><td class="r">${E(v)}</td><td class="r ${d>=0?'pos':'neg'}">${E(d)}</td><td><button class="x" data-dp="${i}" aria-label="Supprimer">✕</button></td></tr>`}).join('')}</tbody></table></div><div class="note">Les cours se mettent à jour à la main en les modifiant dans le tableau.</div>`:'<div class="empty">Aucune ligne. Ajoute-en une ci-dessous.</div>'}

 $('#app').innerHTML=({budget,patrimoine:pat,pea:()=>ptf('pea'),cto:()=>ptf('cto'),credit:cred})[p]();p==='budget'?oldBind('budget'):bind2(p)};

 q('#fo',e=>{S.fo=e.value;render()});q('.px2',e=>{const v=num(e.value);if(!isNaN(v))S.ptf[p][e.dataset.i].price=v;A()});c('[data-dp]',e=>{S.ptf[p].splice(e.dataset.dp,1);A()});
 q('[data-pv]',e=>{(S.pv[e.dataset.pv]=S.pv[e.dataset.pv]||{})[e.dataset.k]=e.value;A()});
 c('#padd',()=>{const n=$('#pn').value.trim(),a=num($('#pq').value),b=num($('#pp').value),d=num($('#pc').value);if(!n||isNaN(a)||isNaN(b))return;S.ptf[p].push({own:$('#po').value,name:n,qty:a,pru:b,price:isNaN(d)?b:d});A()});

$('#nav').innerHTML='<a href="#budget">Budget</a><a href="#patrimoine">Comptes</a><a href="#pea">PEA</a><a href="#cto">CTO</a><a href="#credit">Crédits</a>';
const hb=it=>{const M=Math.max(...it.flatMap(x=>[x[1],x[2]]),1),H=it.length*38+8;return`<div class="tw"><svg viewBox="0 0 600 ${H}" style="width:100%;min-width:420px" role="img" aria-label="Investi et valeur actuelle par ligne">${it.map((x,i)=>{const y=i*38+4,a=x[1]/M*330,b=x[2]/M*330,g=x[2]-x[1],c=g>=0?'var(--pos)':'var(--neg)';return`<text x="0" y="${y+13}" font-size="12" fill="var(--ink)">${esc(x[0].slice(0,22))}</text><rect x="150" y="${y}" width="${a}" height="12" fill="var(--mut)" opacity=".55"/><rect x="150" y="${y+14}" width="${b}" height="12" fill="${c}"/><text x="${150+Math.max(a,b)+6}" y="${y+23}" font-size="12" fill="${c}">${g>=0?'+':''}${E(g)}</text>`}).join('')}</svg></div><div class="note">Gris : montant investi. Couleur : valeur actuelle, verte en cas de gain, rouge en cas de perte.</div>`};
