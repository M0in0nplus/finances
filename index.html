<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes finances</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ef;--surf:#fff;--ink:#14232b;--mut:#5c6b72;--line:#d5dcd9;--acc:#0f6e7a;--acc2:#c98a1b;--neg:#b3412f;--pos:#2d7a4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--surf:#18242a;--ink:#e6eeee;--mut:#93a4a9;--line:#2a3a41;--acc:#4fb3bf;--acc2:#e0a63c;--neg:#e0715d;--pos:#63b985}}
:root[data-theme="dark"]{--bg:#10181c;--surf:#18242a;--ink:#e6eeee;--mut:#93a4a9;--line:#2a3a41;--acc:#4fb3bf;--acc2:#e0a63c;--neg:#e0715d;--pos:#63b985}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 12px}
p.sub{margin:0 0 18px;color:var(--mut)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
nav a{padding:10px 16px;color:var(--mut);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--ink);border-color:var(--acc)}
nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
button,.btn{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--mut);padding:2px 8px;border:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mut)}
.bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:5px 0;cursor:pointer;font-size:14px;border:0;background:none;width:100%;color:var(--ink);text-align:left;font-weight:400}
.bar.sel{font-weight:700}
.track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--acc);border-radius:6px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.l{white-space:normal;min-width:180px}
th.r,td.r{text-align:right}
th{color:var(--mut);font-weight:500;font-size:13px}
.empty{color:var(--mut);padding:8px 0}
.prog{height:16px;background:var(--bg);border-radius:8px;overflow:hidden;margin:8px 0}
.prog div{height:100%;background:var(--acc2)}
.note{font-size:13px;color:var(--mut);margin-top:8px}
@media (max-width:560px){.bar{grid-template-columns:100px 1fr 70px}}
</style>
</head>
<body>
<main>
<h1>Mes finances</h1>
<p class="sub">Tout reste dans ton navigateur. Rien n’est envoyé nulle part.</p>
<nav id="nav"><a href="#budget">Budget</a><a href="#pea">PEA</a><a href="#credit">Crédit immobilier</a></nav>
<div id="app"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const E=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const E2=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='finances-v1';
let S={tx:[],pea:{pos:[],verse:'',open:''},cred:{capital:'',taux:'',annees:'',debut:'',assur:''},month:'all',cat:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const CATS=['Alimentation','Restaurants','Transport','Logement & crédit','Abonnements','Loisirs','Santé','Shopping','Épargne','Revenus','Autre'];
const RULES=[
['Épargne',/trade ?republic|\bpea\b|livret|epargne|épargne|assurance.?vie/i],
['Logement & crédit',/pret|prêt|echeance|échéance|credit imm|crédit imm|loyer|edf|engie|veolia|syndic|taxe fonc|assurance hab|\beau\b/i],
['Alimentation',/carrefour|leclerc|lidl|auchan|intermarch|monoprix|aldi|super ?u|casino|picard|biocoop|grand frais|franprix|boulanger|drive|primeur|boucherie/i],
['Restaurants',/restaurant|mcdo|mcdonald|burger|uber ?eats|deliveroo|pizza|kebab|caf[eé]|brasserie|sushi|bar /i],
['Transport',/sncf|total|esso|\bbp\b|station|essence|p[eé]age|vinci|uber|ratp|navigo|parking|autoroute|carburant|blablacar/i],
['Abonnements',/netflix|spotify|disney|canal|prime video|apple\.com|google|orange|sfr|bouygues|free mobile|\bfree\b|deezer|abonnement/i],
['Santé',/pharmacie|docteur|dr |m[eé]decin|dentiste|mutuelle|optique|kin[eé]/i],
['Loisirs',/cin[eé]ma|fnac|decathlon|d[eé]cathlon|steam|playstation|cultura|sport|p[eê]che|concert|ticketmaster|voyage|booking|airbnb|jeux|bowling/i],
['Shopping',/amazon|zalando|ikea|leroy ?merlin|castorama|action|vinted|cdiscount|h&m|kiabi/i]];
const guess=(label,amt)=>{if(amt>0&&!/trade ?republic|\bpea\b/i.test(label))return'Revenus';for(const[c,re]of RULES)if(re.test(label))return c;return'Autre'};

function parseCSV(t){const d=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';
 const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
  else c+=ch}
 r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
const num=s=>{if(s==null)return NaN;s=String(s).replace(/[\s\u00a0€+]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');return s===''?NaN:parseFloat(s)};
const pdate=s=>{s=String(s).trim();let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;
 m=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length==2?'20'+m[3]:m[3];return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null};

function importRows(rows){
 let h=rows.findIndex((r,i)=>i<20&&r.some(x=>/^date/i.test(x.trim()))&&r.some(x=>/montant|amount|d[eé]bit|cr[eé]dit/i.test(x)));
 let hdr=h>=0?rows[h].map(x=>x.trim()):null,body=h>=0?rows.slice(h+1):rows;
 const idx=re=>hdr?hdr.findIndex(x=>re.test(x)):-1;
 let iD=idx(/^date/i),iL=idx(/libell|label|description|intitul|d[eé]tail|objet/i),iM=idx(/^montant|amount/i),iDb=idx(/d[eé]bit/i),iCr=idx(/cr[eé]dit/i);
 if(!hdr){iD=0;iL=1;iM=2}
 if(iD<0)iD=0;if(iL<0)iL=1;
 const seen={};let added=0;
 const have={};S.tx.forEach(t=>{const k=t.date+'|'+t.label+'|'+t.amount;have[k]=(have[k]||0)+1});
 for(const r of body){const date=pdate(r[iD]||'');if(!date)continue;
  let a=iM>=0?num(r[iM]):NaN;
  if(isNaN(a)&&(iDb>=0||iCr>=0)){const db=num(r[iDb]),cr=num(r[iCr]);a=(isNaN(cr)?0:Math.abs(cr))-(isNaN(db)?0:Math.abs(db))}
  if(isNaN(a)||a===0)continue;
  const label=(r[iL]||'').trim().replace(/\s+/g,' ');const k=date+'|'+label+'|'+a;
  seen[k]=(seen[k]||0)+1;if(seen[k]<=(have[k]||0))continue;
  S.tx.push({date,label,amount:a,cat:guess(label,a)});added++}
 S.tx.sort((a,b)=>b.date.localeCompare(a.date));save();return added}

function readFile(f){const rd=new FileReader();rd.onload=()=>{const b=rd.result;let t;
 try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('windows-1252').decode(b)}
 const n=importRows(parseCSV(t.replace(/^\uFEFF/,'')));msg(n?`${n} opérations importées.`:'Aucune opération reconnue. Vérifie que le fichier est un export CSV avec une colonne date et un montant.');render()};rd.readAsArrayBuffer(f)}
let flash='';const msg=t=>{flash=t};

function sample(){const m=['2026-08','2026-09','2026-10'];const L=[['Carrefour',-86.4,3],['Leclerc drive',-112.7,2],['Restaurant Le Quai',-48,2],['Total station',-62,2],['Netflix',-13.49,1],['Pharmacie',-18.3,1],['Decathlon',-74.9,1],['Prêt immobilier échéance',-912,1],['Salaire',2650,1],['Virement Trade Republic',-300,1],['Amazon',-39.9,1]];
 S.tx=[];m.forEach(mo=>L.forEach(([l,a,n])=>{for(let i=0;i<n;i++){const d=String(2+i*9+Math.floor(Math.random()*5)).padStart(2,'0');S.tx.push({date:`${mo}-${d}`,label:l,amount:+(a*(a<0&&n>1?(0.85+Math.random()*.3):1)).toFixed(2),cat:guess(l,a)})}}));
 S.tx.sort((a,b)=>b.date.localeCompare(a.date));save();msg('Données d’exemple chargées. Efface-les avant d’importer tes vrais relevés.');render()}

const MN=m=>{const[y,mm]=m.split('-');return new Date(y,mm-1,1).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})};

function budget(){
 const months=[...new Set(S.tx.map(t=>t.date.slice(0,7)))].sort().reverse();
 const yrs=[...new Set(months.map(m=>m.slice(0,4)))];S.pm=S.pm||'all';const opts=S.pm==='cmpY'||S.pm==='year'?yrs:months;if(!opts.includes(S.pa))S.pa=opts[0];if(!opts.includes(S.pb))S.pb=opts[1]||opts[0];
 const pk=t=>S.pm==='year'||S.pm==='cmpY'?t.date.slice(0,4):t.date.slice(0,7);
 const oo=s=>opts.map(o=>`<option value="${o}" ${s===o?'selected':''}>${o.length===4?o:MN(o)}</option>`).join('');
 const PSEL=`<div class="row"><label>Période<select id="pm">${[['all','Tout l’historique'],['month','Un mois'],['year','Une année'],['cmpM','Comparer 2 mois'],['cmpY','Comparer 2 années']].map(([v,l])=>`<option value="${v}" ${S.pm===v?'selected':''}>${l}</option>`).join('')}</select></label>${S.pm!=='all'?`<label>${S.pm.startsWith('cmp')?'Période A':'Choix'}<select id="pa">${oo(S.pa)}</select></label>`:''}${S.pm.startsWith('cmp')?`<label>Période B<select id="pb">${oo(S.pb)}</select></label>`:''}</div>`;
 const inM=S.tx.filter(t=>S.pm==='all'||(S.pm==='cmpM'||S.pm==='cmpY'?(pk(t)===S.pa||pk(t)===S.pb):pk(t)===S.pa));
 const rev=inM.filter(t=>t.cat==='Revenus'||t.amount>0).reduce((s,t)=>s+(t.amount>0?t.amount:0),0);
 const out=inM.filter(t=>t.amount<0);
 const ep=out.filter(t=>t.cat==='Épargne').reduce((s,t)=>s-t.amount,0);
 const dep=out.filter(t=>t.cat!=='Épargne').reduce((s,t)=>s-t.amount,0);
 const bycat={};out.forEach(t=>bycat[t.cat]=(bycat[t.cat]||0)-t.amount);
 const cats=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);const mx=cats.length?cats[0][1]:1;
 const shown=inM.filter(t=>!S.cat||t.cat===S.cat);
 let h=`<div class="panel"><div class="note" style="margin:0 0 10px"><b>Compte concerné : compte chèque, Couple.</b> Importe ici uniquement le relevé de ce compte.</div><div class="row"><label class="btn" style="cursor:pointer">Importer un relevé (CSV)<input id="file" type="file" accept=".csv,.txt" hidden></label>
 <button class="alt" id="demo">Voir un exemple</button>${S.tx.length?'<button class="alt" id="clear">Tout effacer</button>':''}</div>
 ${flash?`<div class="note" role="status">${esc(flash)}</div>`:''}
 <div class="note">Dans l’espace client de ta banque, cherche « Exporter » ou « Télécharger » sur la liste des opérations, au format CSV ou Excel (enregistre l’Excel en CSV). Tu peux importer plusieurs mois, les doublons sont ignorés.</div></div>`;
 if(!S.tx.length)return h+'<div class="drop">Dépose un fichier ci-dessus pour voir ton budget apparaître.</div>';
 if(S.pm==='cmpM'||S.pm==='cmpY'){const lab=k=>k&&k.length===4?k:MN(k||'0000-01'),P=k=>{const T=S.tx.filter(t=>pk(t)===k),dd=T.filter(t=>t.amount<0&&t.cat!=='Épargne'),C={};dd.forEach(t=>C[t.cat]=(C[t.cat]||0)-t.amount);return{rev:T.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0),dep:-dd.reduce((s,t)=>s+t.amount,0),C}},a=P(S.pa),b=P(S.pb),row=(n,x,y,bad)=>`<tr><td>${n}</td><td class="r">${E(x)}</td><td class="r">${E(y)}</td><td class="r ${(y-x>0)===bad?'neg':'pos'}">${y-x>0?'+':''}${E(y-x)}</td></tr>`,cs=[...new Set([...Object.keys(a.C),...Object.keys(b.C)])].sort((x,y)=>Math.max(b.C[y]||0,a.C[y]||0)-Math.max(b.C[x]||0,a.C[x]||0)),mx=Math.max(...cs.flatMap(c=>[a.C[c]||0,b.C[c]||0]),1);
 return h+PSEL+`<div class="panel"><h2>Comparaison</h2><div class="tw"><table><thead><tr><th></th><th class="r">${lab(S.pa)}</th><th class="r">${lab(S.pb)}</th><th class="r">Écart</th></tr></thead><tbody>${row('Revenus',a.rev,b.rev,false)}${row('Dépenses',a.dep,b.dep,true)}${row('Solde',a.rev-a.dep,b.rev-b.dep,false)}</tbody></table></div><div class="note">Écart = période B moins période A. Le solde exclut l’épargne versée.</div></div><div class="panel"><h2>Dépenses par catégorie</h2>${cs.map(c=>`<div class="bar" style="cursor:default"><span>${esc(c)}</span><span class="track"><span class="fill" style="display:block;width:${(a.C[c]||0)/mx*100}%"></span></span><span>${E(a.C[c]||0)}</span></div><div class="bar" style="cursor:default;padding-top:0"><span></span><span class="track"><span class="fill" style="display:block;width:${(b.C[c]||0)/mx*100}%;background:var(--acc2)"></span></span><span>${E(b.C[c]||0)}</span></div>`).join('')||'<div class="empty">Aucune dépense.</div>'}<div class="note"><span style="color:var(--acc)">■</span> ${lab(S.pa)} &nbsp; <span style="color:var(--acc2)">■</span> ${lab(S.pb)}</div></div>`}
 const sav=rev?Math.round((rev-dep)/rev*100):0;
 h+=`${PSEL}
 <div class="kpis"><div class="kpi"><span>Revenus</span><b class="pos">${E(rev)}</b></div><div class="kpi"><span>Dépenses</span><b>${E(dep)}</b></div><div class="kpi"><span>Épargne versée</span><b>${E(ep)}</b></div><div class="kpi"><span>Solde de la période</span><b class="${rev-dep-ep>=0?'pos':'neg'}">${E(rev-dep-ep)}</b></div><div class="kpi"><span>Part de revenus non dépensée</span><b>${sav} %</b></div></div>`;
 h+=`<div class="panel"><h2>Où part l’argent</h2>${cats.map(([c,v])=>`<button class="bar ${S.cat===c?'sel':''}" data-cat="${esc(c)}"><span>${esc(c)}</span><span class="track"><span class="fill" style="display:block;width:${v/mx*100}%"></span></span><span>${E(v)}</span></button>`).join('')||'<div class="empty">Aucune dépense sur cette période.</div>'}<div class="note">Clique sur une catégorie pour filtrer les opérations.</div></div>`;
 const srcOf=l=>{const w=l.replace(/\d+/g,' ').replace(/\b(vir|virement|sepa|recu|reçu|inst|de|du|par|salaire|paie|ref|motif|cpte|pour|mme)\b/gi,' ').split(/[^A-Za-zÀ-ÿ&]+/).filter(x=>x.length>1).slice(0,2).join(' ')||l.split(' ')[0]||'Autre';const tp=/\bcaf\b|allocation|activit|p[oô]le emploi|france travail|\bapl\b|\bmsa\b/i.test(l)?'Allocations':/cpam|cnam|ameli|assurance maladie|mutuelle|rembours|pr[eé]voyance|cotisation|harmonie|malakoff|\bmgen\b|\balan\b/i.test(l)?'Santé (mutuelle, CPAM)':/katamania|salaire|paie\b|r[eé]mun[eé]ration/i.test(l)?'Salaire':/dgfip|imp[oô]t|tr[eé]sor/i.test(l)?'Impôts':/int[eé]r[eê]t/i.test(l)?'Intérêts':/livret|[eé]pargne|\bpea\b|trade ?republic/i.test(l)?'Virement entre comptes':/virement|\bvir\b|paypal|lydia|wero|vinted|leboncoin/i.test(l)?'Virements reçus':'Autres';const nm=w[0].toUpperCase()+w.slice(1).toLowerCase();return nm.toLowerCase()===tp.toLowerCase()?tp:tp+' : '+nm};const SR={};inM.filter(t=>t.amount>0).forEach(t=>{const k=srcOf(t.label);SR[k]=(SR[k]||0)+t.amount});const sr=Object.entries(SR).sort((a,b)=>b[1]-a[1]),sm=sr.length?sr[0][1]:1;
 h+=`<div class="panel"><h2>D’où viennent les revenus</h2>${sr.map(([c,v])=>`<div class="bar" style="cursor:default"><span>${esc(c)}</span><span class="track"><span class="fill" style="display:block;width:${v/sm*100}%;background:var(--acc2)"></span></span><span>${E(v)}</span></div>`).join('')||'<div class="empty">Aucun revenu sur cette période.</div>'}</div>`;
 h+=catChart();
 const ms=[...months].reverse();
 if(ms.length>0){const agg=ms.map(m=>{const t=S.tx.filter(x=>x.date.startsWith(m));return[m,t.filter(x=>x.amount>0).reduce((s,x)=>s+x.amount,0),-t.filter(x=>x.amount<0&&x.cat!=='Épargne').reduce((s,x)=>s+x.amount,0)]});
  const M=Math.max(...agg.flat().filter(x=>typeof x==='number'),1),w=600/agg.length;
  h+=`<div class="panel"><h2>Mois par mois</h2><div class="tw"><svg viewBox="0 0 600 180" style="width:100%;min-width:320px" role="img" aria-label="Revenus et dépenses par mois">${agg.map(([m,r,d],i)=>{const x=i*w+w*.12,bw=w*.34;return`<rect x="${x}" y="${150-r/M*130}" width="${bw}" height="${r/M*130}" fill="var(--acc2)"/><rect x="${x+bw+2}" y="${150-d/M*130}" width="${bw}" height="${d/M*130}" fill="var(--acc)"/><text x="${x+bw}" y="170" font-size="11" text-anchor="middle" fill="var(--mut)">${MN(m)}</text>`}).join('')}</svg></div><div class="note"><span style="color:var(--acc2)">■</span> Revenus &nbsp; <span style="color:var(--acc)">■</span> Dépenses</div></div>`}
